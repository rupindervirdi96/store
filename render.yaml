# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: store-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start -w @store/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
